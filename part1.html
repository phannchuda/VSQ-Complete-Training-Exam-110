<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSQ Complete Training Exam — Part 1</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f8fc;color:#17324d}
.wrap{max-width:900px;margin:auto;padding:24px} .card{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 28px #183b5b18;margin:16px 0}
h1{margin:0 0 8px;color:#1267a8} .muted{color:#65788a} label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #c8d6e3;border-radius:10px;font-size:16px;background:white}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#1674b8;color:white} .secondary{background:#e8f1f8;color:#174d73} .danger{background:#b42318;color:white}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center} .hide{display:none!important}
.progress{height:10px;background:#e6edf3;border-radius:99px;overflow:hidden} .bar{height:100%;background:#1674b8}
.q{font-size:20px;font-weight:700;line-height:1.55;margin:18px 0}
.opt{display:block;border:1px solid #d8e2ea;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.45}
.opt:has(input:checked){border:2px solid #1674b8;background:#eef7ff} .opt input{width:auto;margin-right:9px}
.score{font-size:34px;font-weight:800;color:#1267a8} .pass{color:#137333} .fail{color:#b42318}
@media(max-width:650px){.wrap{padding:10px}.card{padding:18px}.row{flex-wrap:wrap}}
</style>
</head>
<body><div class="wrap">
<div class="card">
<h1>VSQ Complete Training Exam — Part 1</h1>
<div class="muted">50 ข้อ • ผ่าน 40/50 (80%) • ทำทีละข้อ</div>
</div>

<div id="profile" class="card">
<label>ชื่อ–นามสกุล</label><input id="fullName">
<label>ชื่อเล่น</label><input id="nickName">
<label>สาขา</label><select id="branch"><option value="">เลือกสาขา</option><option value="ปิ่นเกล้า">ปิ่นเกล้า</option>
<option value="เซ็นทรัลเวสต์วิลล์">เซ็นทรัลเวสต์วิลล์</option>
<option value="เมเจอร์ รัชโยธิน">เมเจอร์ รัชโยธิน</option>
<option value="เดอะพรอมานาด">เดอะพรอมานาด</option>
<option value="เกตเวย์ เอกมัย">เกตเวย์ เอกมัย</option>
<option value="ซีคอนศรีนครินทร์">ซีคอนศรีนครินทร์</option>
<option value="เดอะมอลล์ บางกะปิ">เดอะมอลล์ บางกะปิ</option>
<option value="ฟิวเจอร์พาร์ค รังสิต">ฟิวเจอร์พาร์ค รังสิต</option>
<option value="เซ็นทรัล พระราม 2">เซ็นทรัล พระราม 2</option>
<option value="เซ็นทรัล บางนา">เซ็นทรัล บางนา</option>
<option value="สยามสแควร์วัน">สยามสแควร์วัน</option>
<option value="เซ็นทรัล อีสวิลล์">เซ็นทรัล อีสวิลล์</option>
<option value="เซ็นทรัล ลาดพร้าว">เซ็นทรัล ลาดพร้าว</option>
<option value="เซ็นทรัล แจ้งวัฒนะ">เซ็นทรัล แจ้งวัฒนะ</option>
<option value="พาซิโอ้ กาญจนาภิเษก">พาซิโอ้ กาญจนาภิเษก</option>
<option value="เซ็นทรัล พระราม 3">เซ็นทรัล พระราม 3</option>
<option value="เอ็มควอเทียร์">เอ็มควอเทียร์</option>
<option value="เดอะมอลล์ บางแค">เดอะมอลล์ บางแค</option>
<option value="เซ็นทรัลเวสเกต">เซ็นทรัลเวสเกต</option>
<option value="เดอะมอลล์ ท่าพระ">เดอะมอลล์ ท่าพระ</option>
<option value="เซ็นทรัล รามอินทรา">เซ็นทรัล รามอินทรา</option>
<option value="เทอมินอลอโศก">เทอมินอลอโศก</option>
<option value="เซ็นทรัล นครปฐม">เซ็นทรัล นครปฐม</option>
<option value="พระราม 9">พระราม 9</option>
<option value="เมกา บางนา">เมกา บางนา</option>
<option value="เซ็นทรัลเวิล">เซ็นทรัลเวิล</option>
<option value="วันแบง ค็อก">วันแบง ค็อก</option>
<option value="เดอะมอลล์งามวงศ์วาน">เดอะมอลล์งามวงศ์วาน</option>
<option value="ทองหล่อ">ทองหล่อ</option>
<option value="ดุสิต เซ็นทรัลพาร์ค">ดุสิต เซ็นทรัลพาร์ค</option>
<option value="เลียบด่วนรามอินทรา">เลียบด่วนรามอินทรา</option>
<option value="ไม่ประจำสาขา">ไม่ประจำสาขา</option>
<option value="ออฟฟิศ">ออฟฟิศ</option></select>
<label>ตำแหน่ง</label><select id="role" onchange="toggleOther()"><option value="">เลือกตำแหน่ง</option><option value="ผู้จัดการสาขา">ผู้จัดการสาขา</option>
<option value="รองผู้จัดการสาขา">รองผู้จัดการสาขา</option>
<option value="ผู้ช่วยผู้จัดการสาขา (ฟร้อน 3)">ผู้ช่วยผู้จัดการสาขา (ฟร้อน 3)</option>
<option value="ผู้ประสานงานคลินิก (เสมียน)">ผู้ประสานงานคลินิก (เสมียน)</option>
<option value="ฟร้อนเลเซอร์ขน">ฟร้อนเลเซอร์ขน</option>
<option value="พนักงานต้อนรับ (ฟร้อนท์เลเซอร์พิโค)">พนักงานต้อนรับ (ฟร้อนท์เลเซอร์พิโค)</option>
<option value="นักกายภาพ (SP)">นักกายภาพ (SP)</option>
<option value="นักกายภาพ (LS)">นักกายภาพ (LS)</option>
<option value="นักกายภาพและเลเซอร์ (LSP)">นักกายภาพและเลเซอร์ (LSP)</option>
<option value="พยาบาล">พยาบาล</option>
<option value="ผู้ช่วยแพทย์">ผู้ช่วยแพทย์</option>
<option value="ผู้ช่วยโกน">ผู้ช่วยโกน</option>
<option value="ผู้ช่วยแพทย์ Pico">ผู้ช่วยแพทย์ Pico</option>
<option value="ล่าม">ล่าม</option>
<option value="ผู้ช่วยพยาบาล (ANA)">ผู้ช่วยพยาบาล (ANA)</option>
<option value="อื่นๆ">อื่นๆ</option></select>
<div id="otherWrap" class="hide"><label>ระบุตำแหน่ง</label><input id="otherRole"></div>
<div style="margin-top:20px"><button class="primary" onclick="startExam()">เริ่มทำข้อสอบ Part 1</button></div>
<div id="msg" class="muted" style="margin-top:12px"></div>
</div>

<div id="exam" class="card hide">
<div class="row"><b id="counter"></b><span id="saved" class="muted">พร้อมบันทึก</span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="qtext" class="q"></div><div id="options"></div>
<div class="row" style="margin-top:20px">
<button class="secondary" onclick="prevQ()">← ก่อนหน้า</button>
<button id="nextBtn" class="primary" onclick="nextQ()">ถัดไป →</button>
<button id="submitBtn" class="danger hide" onclick="submitExam()">ส่งข้อสอบ</button>
</div>
</div>

<div id="result" class="card hide">
<h2>ผลสอบ Part 1</h2><div id="score" class="score"></div><h2 id="status"></h2>
<div id="weak"></div><div id="overall"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwZruqyW7udshfh4pMoJSuQXDr1tY0oaXjWWuyES3V-oPXdKHBu0pj5uQQf68mBrLGb/exec", PART=1, LOCAL_KEY="vsq_exam_p1_v2";
let S={examId:"",questions:[],answers:{},index:0,profile:null};

function val(id){return document.getElementById(id).value.trim()}
function toggleOther(){document.getElementById("otherWrap").classList.toggle("hide",val("role")!=="อื่นๆ")}
function finalRole(){return val("role")==="อื่นๆ" ? val("otherRole") : val("role")}
function jp(params){
  return new Promise((resolve,reject)=>{
    const cb="vsqcb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("หมดเวลาการเชื่อมต่อ"))},60000);
    function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.remove()}
    window[cb]=(data)=>{cleanup();resolve(data)};
    params.callback=cb;
    s.src=API+"?"+new URLSearchParams(params).toString();
    s.onerror=()=>{cleanup();reject(new Error("เชื่อมต่อไม่สำเร็จ"))};
    document.body.appendChild(s);
  });
}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(S))}
function packAnswers(a){return Object.keys(a).sort().map(k=>k+":"+a[k]).join(",")}
function loadLocal(){
  try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(x&&x.profile){
    fullName.value=x.profile.fullName||"";nickName.value=x.profile.nickName||"";
    branch.value=x.profile.branch||""; 
    const known=[...role.options].some(o=>o.value===x.profile.role);
    if(known) role.value=x.profile.role; else {role.value="อื่นๆ";otherRole.value=x.profile.role||"";toggleOther()}
  }}catch(e){}
}
async function startExam(){
  const profile={fullName:val("fullName"),nickName:val("nickName"),branch:val("branch"),role:finalRole()};
  if(!profile.fullName||!profile.nickName||!profile.branch||!profile.role){msg.textContent="กรุณากรอกข้อมูลให้ครบ";return}
  msg.textContent="กำลังเชื่อมต่อ...";
  try{
    const d=await jp({action:"start",part:PART,...profile});
    if(!d.ok) throw new Error(d.error||"เริ่มข้อสอบไม่ได้");
    S.examId=d.examId;S.profile=profile;
    if(d.locked){showResult(d.result,d.summary);return}
    S.questions=d.questions;S.answers=d.savedAnswers||{};
    const local=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");
    if(local&&local.examId===S.examId&&local.answers){S.answers={...S.answers,...local.answers};S.index=Number(local.index||0)}
    saveLocal(); profileEl(false); render();
  }catch(e){msg.textContent="❌ "+e.message}
}
function profileEl(show){document.getElementById("profile").classList.toggle("hide",!show);document.getElementById("exam").classList.toggle("hide",show)}
function render(){
  const q=S.questions[S.index]; if(!q)return;
  counter.textContent=`ข้อ ${S.index+1} / ${S.questions.length}`;
  bar.style.width=((S.index+1)*100/S.questions.length)+"%";
  qtext.textContent=q.text; options.innerHTML="";
  q.options.forEach(o=>{
    const lab=document.createElement("label");lab.className="opt";
    const r=document.createElement("input");r.type="radio";r.name="ans";r.value=o.id;r.checked=S.answers[q.id]===o.id;
    r.onchange=()=>{S.answers[q.id]=o.id;saveLocal();saveServer()};
    lab.appendChild(r);lab.appendChild(document.createTextNode(o.text));options.appendChild(lab);
  });
  nextBtn.classList.toggle("hide",S.index===S.questions.length-1);
  submitBtn.classList.toggle("hide",S.index!==S.questions.length-1);
}
function prevQ(){if(S.index>0){S.index--;saveLocal();render()}}
function nextQ(){if(S.index<S.questions.length-1){S.index++;saveLocal();render()}}
let saveTimer;
function saveServer(){
  saved.textContent="กำลังบันทึก...";
  clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
    try{const d=await jp({action:"save",part:PART,examId:S.examId,answers:packAnswers(S.answers)});saved.textContent=d.ok?"บันทึกแล้ว ✓":"บันทึกไม่สำเร็จ"}
    catch(e){saved.textContent="เก็บไว้ในเครื่องแล้ว"}
  },500);
}
async function submitExam(){
  const missing=S.questions.filter(q=>!S.answers[q.id]).length;
  if(missing){alert("ยังตอบไม่ครบ "+missing+" ข้อ");return}
  if(!confirm("ยืนยันส่งข้อสอบ Part 1 ? เมื่อส่งแล้วจะแก้ไขไม่ได้"))return;
  submitBtn.disabled=true;submitBtn.textContent="กำลังส่ง...";
  try{
    const d=await jp({action:"submit",part:PART,examId:S.examId,answers:packAnswers(S.answers)});
    if(!d.ok)throw new Error(d.error||"ส่งข้อสอบไม่สำเร็จ");
    localStorage.removeItem(LOCAL_KEY);showResult(d.result,d.summary);
  }catch(e){alert("❌ "+e.message);submitBtn.disabled=false;submitBtn.textContent="ส่งข้อสอบ"}
}
function showResult(r,summary){
  document.getElementById("profile").classList.add("hide");document.getElementById("exam").classList.add("hide");result.classList.remove("hide");
  score.textContent=`${r.correct}/${r.total} (${r.percent}%)`;
  status.textContent=r.status;status.className=r.passed?"pass":"fail";
  const w=r.weakTopics||[];weak.innerHTML=w.length?"<b>หัวข้อที่ควรทบทวน:</b> "+w.map(x=>x.topic+" "+x.percent+"%").join(" • "):"<b>ไม่มีหัวข้อที่ต่ำกว่า 80%</b>";
  if(summary){
    let h="<hr><h3>สรุปผล</h3>";
    if(summary.part1)h+=`Part 1: ${summary.part1.correct}/${summary.part1.total} (${summary.part1.percent}%)<br>`;
    if(summary.part2)h+=`Part 2: ${summary.part2.correct}/${summary.part2.total} (${summary.part2.percent}%)<br>`;
    if(summary.overall)h+=`<b>รวม: ${summary.overall.correct}/${summary.overall.total} (${summary.overall.percent}%)</b><br><b>สถานะรวม: ${summary.status}</b>`;
    overall.innerHTML=h;
  }
}
loadLocal();
</script></body></html>
